<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StitchCast - Hands-Free Craft Video Player</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-pink: #ec4899;
      --accent-hover: #db2777;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }
    h1 span { color: var(--accent-pink); }
    .tagline { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

    .input-bar {
      display: flex;
      width: 100%;
      max-width: 680px;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: white;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent-pink); }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-primary { background: var(--accent-pink); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }

    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 680px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    #player { width: 100%; height: 100%; }
    .mirrored { transform: scaleX(-1); }

    .controls-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mic-status {
      margin-top: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      min-height: 24px;
    }
    .mic-status.active { color: var(--success); }

    .command-guide {
      margin-top: 32px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 10px;
      max-width: 680px;
      width: 100%;
      border: 1px solid #334155;
    }
    .command-guide h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--accent-pink); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      border: 1px solid #334155;
    }
    .chip b { color: white; }
  </style>
</head>
<body>

  <header>
    <h1>Stitch<span>Cast</span></h1>
    <p class="tagline">Hands-free voice control & left-hand mirroring for craft tutorials</p>
  </header>

  <div class="input-bar">
    <input type="text" id="video-url" placeholder="Paste any YouTube tutorial URL here..." />
    <button class="btn-primary" onclick="loadUserVideo()">Load Tutorial</button>
  </div>

  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <div class="controls-row">
    <button class="btn-secondary" id="mirror-btn" onclick="toggleMirror()">Flip Left-Hand View</button>
    <button class="btn-primary" id="mic-btn" onclick="startVoice()">Enable Voice Control</button>
  </div>

  <p class="mic-status" id="mic-status">Click "Enable Voice Control" to start</p>

  <div class="command-guide">
    <h3>Available Voice Commands</h3>
    <div class="chips">
      <div class="chip">Say <b>"Pause"</b> or <b>"Stop"</b></div>
      <div class="chip">Say <b>"Play"</b> or <b>"Continue"</b></div>
      <div class="chip">Say <b>"Rewind"</b> (goes back 10s)</div>
      <div class="chip">Say <b>"Forward"</b> (jumps ahead 10s)</div>
      <div class="chip">Say <b>"Mirror"</b> (toggles left-hand view)</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isMirrored = false;
    let recognition;

    // Load default beginner crochet tutorial
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'aAxGTnVNJiE',
        playerVars: { 'playsinline': 1 }
      });
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function loadUserVideo() {
      const url = document.getElementById('video-url').value.trim();
      const videoId = extractVideoId(url);
      if (videoId && player && player.loadVideoById) {
        player.loadVideoById(videoId);
      } else {
        alert("Please paste a valid YouTube video link.");
      }
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      const iframe = document.querySelector('.player-wrapper iframe');
      if (iframe) {
        iframe.classList.toggle('mirrored', isMirrored);
      }
      document.getElementById('mirror-btn').innerText = isMirrored ? "Reset Normal View" : "Flip Left-Hand View";
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser. Please use Chrome or Edge.");
        return;
      }

      if (recognition) {
        recognition.stop();
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        const status = document.getElementById('mic-status');
        status.innerText = "Listening... Speak a command clearly.";
        status.classList.add('active');
        document.getElementById('mic-btn').innerText = "Mic Active";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        const status = document.getElementById('mic-status');
        status.innerText = `Heard: "${transcript}"`;

        if (transcript.includes("pause") || transcript.includes("stop")) {
          player.pauseVideo();
        } else if (transcript.includes("play") || transcript.includes("start") || transcript.includes("continue")) {
          player.playVideo();
        } else if (transcript.includes("rewind") || transcript.includes("back")) {
          player.seekTo(player.getCurrentTime() - 10, true);
        } else if (transcript.includes("forward") || transcript.includes("ahead")) {
          player.seekTo(player.getCurrentTime() + 10, true);
        } else if (transcript.includes("mirror") || transcript.includes("flip")) {
          toggleMirror();
        }
      };

      recognition.onerror = (e) => {
        console.error("Speech error:", e);
      };

      recognition.onend = () => {
        // Auto-restart to keep listening continuously while crafting
        try { recognition.start(); } catch (err) {}
      };

      recognition.start();
    }
  </script>
</body>
</html>
