<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StitchCast - Hands-Free Craft Studio</title>
  <style>
    :root {
      --bg-black: #08080c;
      --card-bg: #12111a;
      --card-border: #232033;
      --lilac: #c9b6f5;
      --pink: #f29bb2;
      --text-main: #fdfcff;
      --text-muted: #8e889f;
      --success: #6ee7b7;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #171526 0%, var(--bg-black) 70%);
      color: var(--text-main);
      padding: 16px 12px 32px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      text-align: center;
    }

    .logo-container {
      width: 90px;
      height: 90px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 16px rgba(201, 182, 245, 0.25));
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--lilac) 0%, var(--pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
      max-width: 320px;
      line-height: 1.35;
    }

    .app-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .url-input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0d0c14;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--lilac);
    }

    button {
      font-family: inherit;
      padding: 11px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.97); }

    .btn-gradient {
      background: linear-gradient(135deg, var(--lilac) 0%, var(--pink) 100%);
      color: #0b0a12;
      font-weight: 700;
    }

    .btn-secondary {
      background: #1c1a29;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1a1726;
    }

    #player { width: 100%; height: 100%; }
    .is-mirrored { transform: scaleX(-1); }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Giant Hands-Free Elbow / Wrist Tap Zones */
    .handsfree-tap-zone {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .tap-box {
      background: #161424;
      border: 1px dashed rgba(201, 182, 245, 0.4);
      border-radius: 12px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .tap-box:active {
      background: #231f38;
      border-color: var(--pink);
    }

    .tap-box .tap-icon {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .tap-box .tap-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--lilac);
    }

    .tap-box .tap-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Row Counter */
    .row-tracker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0c14;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .tracker-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--lilac);
    }

    .save-indicator {
      font-size: 0.72rem;
      color: var(--success);
      display: block;
    }

    .tracker-count {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--pink);
      min-width: 50px;
      text-align: center;
    }

    .tracker-actions {
      display: flex;
      gap: 6px;
    }

    .tracker-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 20px;
      border-radius: 8px;
    }

    /* Status Bar */
    .status-panel {
      background: #0d0c14;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-right: 6px;
    }

    .indicator.active {
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
    }

    .wake-option {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
      line-height: 1.3;
    }

    .btn-share {
      background: rgba(201, 182, 245, 0.08);
      color: var(--lilac);
      border: 1px solid rgba(201, 182, 245, 0.25);
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="160" y1="360" x2="235" y2="150" stroke="#c9b6f5" stroke-width="16" stroke-linecap="round"/>
        <circle cx="242" cy="138" r="15" fill="#c9b6f5"/>
        <polygon points="152,374 168,358 150,350" fill="#c9b6f5"/>

        <line x1="345" y1="390" x2="435" y2="230" stroke="#f29bb2" stroke-width="16" stroke-linecap="round"/>
        <path d="M435 230 C445 210 432 195 420 200 C410 205 408 215 415 224" fill="none" stroke="#f29bb2" stroke-width="16" stroke-linecap="round"/>

        <path d="M 65 160 C 50 140 65 110 90 120 C 110 130 125 210 135 270 C 145 320 160 340 180 320 L 270 240 C 285 225 275 205 255 195 L 135 155 L 145 295" 
              stroke="#c9b6f5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M 270 240 C 285 260 295 340 310 340 C 325 340 325 180 340 180 C 355 180 355 340 370 340 C 385 340 385 195 400 195 C 415 195 425 280 455 265" 
              stroke="#f29bb2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>StitchCast</h1>
    <p class="tagline">Hands-free craft studio & left-hand mirror for tutorials</p>
  </header>

  <div class="app-card">
    <div class="url-input-group">
      <input type="text" id="video-url" placeholder="Paste YouTube link (crochet, knitting...)" />
      <button class="btn-gradient" onclick="loadVideo()">Load</button>
    </div>

    <div class="player-box">
      <div id="player"></div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="mirror-btn" onclick="toggleMirror()">
        <span>⇄</span> Mirror (Left-Hand)
      </button>
      <button class="btn-gradient" id="mic-btn" onclick="toggleMic()">
        <span>🎙</span> Voice Remote
      </button>
    </div>

    <label class="wake-option">
      <input type="checkbox" id="wakeword" onchange="setWakeWord(this.checked)" />
      Require "Stitch" before commands (stops the tutorial's own voice triggering them)
    </label>

    <!-- Hands-Free Wrist/Elbow Touch Zones -->
    <div class="handsfree-tap-zone">
      <div class="tap-box" role="button" tabindex="0" onclick="quickRewind()">
        <div class="tap-icon">↺ 10s</div>
        <div class="tap-text">Rewind 10s</div>
        <div class="tap-sub">Tap with wrist or elbow</div>
      </div>
      <div class="tap-box" role="button" tabindex="0" onclick="changeRow(1)">
        <div class="tap-icon">+1</div>
        <div class="tap-text">Next Row</div>
        <div class="tap-sub">Tap with wrist or elbow</div>
      </div>
    </div>

    <!-- Synced Row Counter -->
    <div class="row-tracker">
      <div>
        <span class="tracker-title">ROW COUNTER</span>
        <span class="save-indicator">● Auto-Saved</span>
      </div>
      <span class="tracker-count" id="row-count">0</span>
      <div class="tracker-actions">
        <button class="btn-secondary tracker-btn" onclick="resetRow()" aria-label="Reset row counter" title="Reset">⟲</button>
        <button class="btn-secondary tracker-btn" onclick="changeRow(-1)" aria-label="Previous row">−</button>
        <button class="btn-secondary tracker-btn" onclick="changeRow(1)">+</button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-panel">
      <div><span class="indicator" id="mic-dot"></span><span id="mic-label">Mic Off</span></div>
      <span id="status-hint">Tap Voice Remote or use wrist tap boxes</span>
    </div>

    <button class="btn-share" onclick="shareApp()">
      <span>↗</span> Share StitchCast with Crafters
    </button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isReady = false;
    let isListening = false;
    let recognition;
    let shouldBePlaying = false;
    let wakeLock = null;
    let micStartedAt = 0;

    // localStorage throws in some private-browsing modes; fall back to no-op
    const store = {
      get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    };

    let currentVideoId = store.get('stitchcast_video_id') || 'aAxGTnVNJiE';
    let isMirrored = store.get('stitchcast_mirror') === '1';
    let rowNumber = loadRow();
    let wakeWordOn = store.get('stitchcast_wakeword') === '1';

    // Row count is stored per video; the old global key is used as a fallback
    function loadRow() {
      const saved = store.get('stitchcast_row_' + currentVideoId) ?? store.get('stitchcast_row');
      const n = parseInt(saved, 10);
      return Number.isNaN(n) ? 0 : Math.max(0, n);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('row-count').textContent = rowNumber;
      document.getElementById('video-url').value = 'https://youtu.be/' + currentVideoId;
      document.getElementById('wakeword').checked = wakeWordOn;
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'r') quickRewind();
      else if (k === 'n') changeRow(1);
      else if (k === 'b') changeRow(-1);
      else if (k === 'm') toggleMirror();
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: currentVideoId,
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => { isReady = true; applyMirror(); },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              shouldBePlaying = true;
            } else if (e.data === YT.PlayerState.PAUSED) {
              // Only resume if the pause came from the OS grabbing the mic, not the user.
              // A pause within 1.5s of the mic starting is treated as the OS; later ones are the user's.
              if (shouldBePlaying && isListening && Date.now() - micStartedAt < 1500) {
                setTimeout(() => {
                  if (player && shouldBePlaying) player.playVideo();
                }, 150);
              } else {
                shouldBePlaying = false;
              }
            }
          }
        }
      });
    }

    function extractVideoId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function loadVideo() {
      const url = document.getElementById('video-url').value.trim();
      const id = extractVideoId(url);
      if (!id) {
        alert("Please enter a valid YouTube link.");
        return;
      }
      currentVideoId = id;
      store.set('stitchcast_video_id', currentVideoId);
      rowNumber = loadRow();
      document.getElementById('row-count').textContent = rowNumber;
      if (player && player.loadVideoById) {
        player.loadVideoById(id);
      }
    }

    function applyMirror() {
      const iframe = document.querySelector('.player-box iframe');
      if (iframe) iframe.classList.toggle('is-mirrored', isMirrored);
      document.getElementById('mirror-btn').textContent = isMirrored ? "Reset Normal View" : "⇄ Mirror (Left-Hand)";
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      store.set('stitchcast_mirror', isMirrored ? '1' : '0');
      applyMirror();
    }

    function changeRow(delta) {
      rowNumber = Math.max(0, rowNumber + delta);
      document.getElementById('row-count').textContent = rowNumber;
      store.set('stitchcast_row_' + currentVideoId, rowNumber);
    }

    function resetRow() {
      if (rowNumber === 0 || confirm('Reset row counter to 0?')) changeRow(-rowNumber);
    }

    function setWakeWord(on) {
      wakeWordOn = on;
      store.set('stitchcast_wakeword', on ? '1' : '0');
    }

    function changeSpeed(dir) {
      if (!player || !player.getAvailablePlaybackRates) return;
      const rates = player.getAvailablePlaybackRates();
      const i = rates.indexOf(player.getPlaybackRate());
      const next = rates[Math.min(rates.length - 1, Math.max(0, i + dir))];
      player.setPlaybackRate(next);
      document.getElementById('status-hint').textContent = `Speed ${next}x`;
    }

    // Keep the screen awake while crafting (phones dim and lock mid-row otherwise)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isListening) requestWakeLock();
    });

    // Word-boundary matching so "display" doesn't trigger "play".
    // Returns true if a command was handled.
    function runCommand(text) {
      if (wakeWordOn) {
        const m = text.match(/\bstitch\b(.*)$/);
        if (!m) return false;
        text = m[1];
      }
      const has = (re) => re.test(text);

      if (has(/\b(previous row|last row|back one row|undo row)\b/)) changeRow(-1);
      else if (has(/\bnext row\b/)) changeRow(1);
      else if (has(/\b(pause|stop)\b/)) { shouldBePlaying = false; player.pauseVideo(); }
      else if (has(/\b(play|resume|start)\b/)) { shouldBePlaying = true; player.playVideo(); }
      else if (has(/\b(rewind|back)\b/)) quickRewind();
      else if (has(/\b(slower|slow down)\b/)) changeSpeed(-1);
      else if (has(/\b(faster|speed up)\b/)) changeSpeed(1);
      else if (has(/\b(mirror|flip)\b/)) toggleMirror();
      else return false;
      return true;
    }

    function quickRewind() {
      if (player && player.getCurrentTime) {
        const t = player.getCurrentTime();
        player.seekTo(Math.max(0, t - 10), true);
      }
    }

    function toggleMic() {
      if (isListening) {
        stopMic();
      } else {
        startMic();
      }
    }

    function startMic() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        alert("Voice recognition requires Chrome, Edge, or Safari.");
        return;
      }

      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micStartedAt = Date.now();
        requestWakeLock();
        document.getElementById('mic-dot').classList.add('active');
        document.getElementById('mic-label').textContent = "Voice Active";
        document.getElementById('status-hint').textContent = wakeWordOn
          ? "Say 'Stitch, next row' / 'rewind' / 'pause'"
          : "Say 'rewind', 'next row', or 'pause'";
        document.getElementById('mic-btn').textContent = "⏹ Stop Voice";

        // Re-assert video playback so mobile OS doesn't kill it
        if (player && shouldBePlaying) {
          player.playVideo();
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        document.getElementById('status-hint').textContent = `Heard: "${transcript}"`;

        if (!player) return;
        runCommand(transcript);
      };

      recognition.onerror = (e) => {
        console.warn("Speech notice:", e.error);
        // Permission denied / unsupported service: stop instead of restart-looping in onend
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          stopMic();
          document.getElementById('status-hint').textContent = "Mic blocked - allow microphone access and retry";
        }
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (err) {}
        }
      };

      try {
        recognition.start();
      } catch (err) {
        console.error(err);
      }
    }

    function stopMic() {
      isListening = false;
      if (recognition) recognition.stop();
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      document.getElementById('mic-dot').classList.remove('active');
      document.getElementById('mic-label').textContent = "Mic Off";
      document.getElementById('status-hint').textContent = "Voice remote stopped";
      document.getElementById('mic-btn').textContent = "🎙 Voice Remote";
    }

    async function shareApp() {
      const shareData = {
        title: 'StitchCast - Hands-Free Craft Studio',
        text: 'Control crochet & knit YouTube tutorials hands-free and mirror videos for lefties!',
        url: window.location.href
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        try {
          await navigator.clipboard.writeText(window.location.href);
          alert('Link copied to clipboard!');
        } catch (err) {
          alert('Share: ' + window.location.href);
        }
      }
    }
  </script>
</body>
</html>
